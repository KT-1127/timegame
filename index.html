<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>AR チャッピー さがし ── 3分タイムアタック</title>
<style>
  :root{
    --paper:#F3EDE0; --ink:#23201B; --frame:#4A3B2E; --shu:#B23A2E; --sky:#3fb6e6;
    --mincho:"Hiragino Mincho ProN","Yu Mincho","Noto Serif JP",serif;
    --gothic:"Hiragino Kaku Gothic ProN","Yu Gothic","Noto Sans JP",system-ui,sans-serif;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;overflow:hidden;background:#051005;
    font-family:var(--gothic);color:var(--ink);overscroll-behavior:none}
  canvas{display:block}

  #hud{position:fixed;inset:0;pointer-events:none;z-index:5;
    padding:calc(env(safe-area-inset-top) + 14px) 16px;
    display:flex;justify-content:space-between;align-items:flex-start}
  .panel{font-family:var(--mincho);color:#fff;text-shadow:0 1px 6px rgba(0,0,0,.85);
    letter-spacing:.1em;line-height:1.5}
  .panel .lab{font-size:11px;opacity:.85}
  .panel b{font-size:30px;font-weight:600;letter-spacing:.02em}
  #timerPanel{text-align:right}
  #timerPanel.warn b{color:#ffd24a}
  #timerPanel.danger b{color:#ff6a5a}
  #mode{position:fixed;left:16px;bottom:calc(env(safe-area-inset-bottom) + 96px);z-index:5;
    font-size:10px;color:#9fb08e;letter-spacing:.1em;pointer-events:none;opacity:.7}

  #net{position:fixed;left:50%;top:50%;width:128px;height:128px;margin:-64px 0 0 -64px;
    pointer-events:none;z-index:5;transition:transform .1s ease}
  #net.swing{transform:scale(.72)}
  #net .ring{fill:none;stroke:rgba(255,255,255,.4);stroke-width:2}
  #net .mesh{stroke:rgba(255,255,255,.2);stroke-width:.7;fill:none}
  #net.on .ring{stroke:#7fe3ff;stroke-width:3}
  #net.on .mesh{stroke:rgba(127,227,255,.5)}

  #target{position:fixed;left:0;right:0;top:calc(50% + 80px);text-align:center;z-index:5;
    font-family:var(--mincho);font-size:15px;letter-spacing:.18em;color:#eaffff;
    text-shadow:0 1px 6px rgba(0,0,0,.9);opacity:0;transition:opacity .12s}
  #target.on{opacity:1}

  .bar{position:fixed;left:0;right:0;bottom:0;z-index:6;display:flex;gap:10px;
    justify-content:center;align-items:center;padding:0 14px calc(env(safe-area-inset-bottom) + 20px)}
  button{font-family:var(--gothic);font-size:16px;border:none;cursor:pointer}
  #catch{pointer-events:auto;background:var(--paper);color:var(--ink);border-radius:999px;
    padding:16px 44px;letter-spacing:.2em;font-weight:700;box-shadow:0 8px 24px rgba(0,0,0,.55)}
  #catch:active{transform:translateY(2px)}
  #catch:disabled{opacity:.5}

  #pop{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%) scale(.4);z-index:7;
    font-family:var(--mincho);font-size:28px;letter-spacing:.1em;color:#fff;font-weight:700;
    text-shadow:0 2px 12px rgba(0,0,0,.6);opacity:0;pointer-events:none}
  #pop.hit{animation:pop .7s ease-out}
  @keyframes pop{0%{opacity:0;transform:translate(-50%,-50%) scale(.4)}
    25%{opacity:1;transform:translate(-50%,-50%) scale(1.15)}
    60%{opacity:1;transform:translate(-50%,-70%) scale(1)}
    100%{opacity:0;transform:translate(-50%,-120%) scale(1)}}

  /* オーバーレイ共通 */
  .over{position:fixed;inset:0;z-index:30;display:flex;flex-direction:column;align-items:center;
    justify-content:center;gap:22px;padding:32px;text-align:center;
    background:radial-gradient(120% 90% at 50% 16%,#5cc0ea 0%,#2a6f96 42%,#0c2333 100%)}
  .over h1{margin:0;font-family:var(--mincho);color:#fff;font-weight:600;font-size:26px;
    letter-spacing:.28em;text-indent:.28em}
  .over p{margin:0;max-width:23em;line-height:2.0;color:#e6f4fb;font-size:14px;letter-spacing:.04em}
  .over .big{font-family:var(--mincho);color:#fff;font-size:64px;font-weight:700;letter-spacing:.04em;
    line-height:1.1;margin:4px 0}
  .over .big small{font-size:22px;opacity:.85;font-weight:500}
  .btn{background:#fff;color:var(--ink);border-radius:999px;padding:17px 46px;
    letter-spacing:.22em;font-weight:700;font-family:var(--mincho);font-size:17px;pointer-events:auto}
  .note{font-size:11px;color:#bcd7e6;letter-spacing:.05em;line-height:1.85}
  #load{color:#dbeaf2;font-size:12px;letter-spacing:.2em;font-family:var(--mincho)}
  #result{display:none}
  .rank{font-family:var(--mincho);font-size:20px;color:#ffe58a;letter-spacing:.2em}
</style>
</head>
<body>

<video id="vid" playsinline muted autoplay
  style="position:fixed;inset:0;width:100%;height:100%;object-fit:cover;z-index:0;display:none;background:#111"></video>

<div id="hud">
  <div class="panel"><span class="lab">みつけた</span><br><b><span id="found">0</span></b> / 20</div>
  <div class="panel" id="timerPanel"><span class="lab">のこり</span><br><b><span id="time">3:00</span></b></div>
</div>
<div id="mode"></div>

<svg id="net" viewBox="0 0 128 128">
  <circle class="ring" cx="64" cy="64" r="52"/>
  <g class="mesh"><path d="M12 64H116M64 12V116"/><circle cx="64" cy="64" r="34"/>
    <circle cx="64" cy="64" r="17"/><path d="M27 27 101 101M101 27 27 101"/></g>
</svg>
<div id="target"></div>
<div id="pop">みつけた！</div>

<div class="bar">
  <button id="catch">つかまえる</button>
</div>

<!-- スタート -->
<div id="start" class="over">
  <h1>チャッピー さがし</h1>
  <p id="lead">読み込み中…</p>
  <button class="btn" id="go" style="display:none">はじめる</button>
  <div class="note" id="note"></div>
</div>

<!-- リザルト -->
<div id="result" class="over">
  <h1>おわり！</h1>
  <div class="big"><span id="score">0</span><small> / 20 匹</small></div>
  <div class="rank" id="rank"></div>
  <p id="rmsg"></p>
  <button class="btn" id="again">もういちど</button>
</div>

<script src="./three.min.js"></script>
<script src="./OrbitControls.js"></script>
<script>
"use strict";

/* 予期せぬエラーだけ小さく表示（通常は非表示） */
var DBG=document.createElement('div');
DBG.style.cssText='position:fixed;z-index:9999;left:0;top:0;right:0;background:rgba(120,0,0,.85);'+
  'color:#fff;font:11px/1.5 ui-monospace,monospace;white-space:pre-wrap;padding:6px 8px;display:none;pointer-events:none';
addEventListener('DOMContentLoaded',function(){document.body.appendChild(DBG);});
function fail(m){ DBG.style.display='block'; DBG.textContent+=m+'\n'; }
window.onerror=function(m,s,l,c){ fail('ERR '+m+' @'+l+':'+c); };
addEventListener('unhandledrejection',function(e){ fail('REJ '+(e.reason&&e.reason.message||e.reason)); });

/* ══════════════════════════════════════════════════════════════
   設定
   ══════════════════════════════════════════════════════════════ */
const CFG = {
  TOTAL       : 20,     // チャッピーの数
  TIME_SEC    : 180,    // 制限時間（秒）＝3分
  CATCH_ANGLE : 9.0,    // 照準の許容角(度)
  CATCH_DIST  : 2.4,    // この距離(m)まで近づくと捕まえられる
  CAT_SCALE   : 1.0,    // チャッピーの大きさ倍率
  TREE_COUNT  : 40,
  FIELD       : 14,     // 森の半径(m)
  EYE_HEIGHT  : 1.5,
  WANDER      : true,   // チャッピーが歩き回る
};

/* ══════════════════════════════════════════════════════════════
   モード判定
   ══════════════════════════════════════════════════════════════ */
let MODE='desktop';
let scene, camera, renderer, controls;
const clock=new THREE.Clock();
const vid=document.getElementById('vid');
const leadEl=document.getElementById('lead'), noteEl=document.getElementById('note');
const goBtn=document.getElementById('go'), modeEl=document.getElementById('mode');

async function detectMode(){
  if(navigator.xr && await navigator.xr.isSessionSupported('immersive-ar').catch(()=>false)) MODE='xr';
  else if(/iPhone|iPad|iPod/.test(navigator.userAgent) && navigator.mediaDevices && navigator.mediaDevices.getUserMedia) MODE='ios';
  else MODE='desktop';
}

/* ══════════════════════════════════════════════════════════════
   Three.js 基本
   ══════════════════════════════════════════════════════════════ */
function initThree(){
  scene=new THREE.Scene();
  camera=new THREE.PerspectiveCamera(62, innerWidth/innerHeight, 0.05, 300);
  camera.position.set(0, CFG.EYE_HEIGHT, 0);

  renderer=new THREE.WebGLRenderer({antialias:true, alpha:true});
  renderer.setSize(innerWidth, innerHeight);
  renderer.setPixelRatio(Math.min(devicePixelRatio,2));
  renderer.setClearColor(0x000000, 0);
  renderer.shadowMap.enabled=true; renderer.shadowMap.type=THREE.PCFSoftShadowMap;
  renderer.xr.enabled=(MODE==='xr');
  renderer.domElement.style.cssText='position:fixed;inset:0;z-index:1';
  document.body.appendChild(renderer.domElement);

  scene.add(new THREE.AmbientLight(0xbcd4e0, 1.35));
  const sun=new THREE.DirectionalLight(0xfff2d8, 1.8);
  sun.position.set(6,14,4); sun.castShadow=true;
  sun.shadow.mapSize.set(2048,2048);
  Object.assign(sun.shadow.camera,{near:0.5,far:50,left:-18,right:18,top:18,bottom:-18});
  scene.add(sun);

  addEventListener('resize',()=>{
    if(MODE==='xr'&&renderer.xr.isPresenting) return;
    camera.aspect=innerWidth/innerHeight; camera.updateProjectionMatrix();
    renderer.setSize(innerWidth,innerHeight);
  });
}

/* ══════════════════════════════════════════════════════════════
   森
   ══════════════════════════════════════════════════════════════ */
const trees=[];
function buildForest(){
  if(MODE!=='xr'){
    const ground=new THREE.Mesh(new THREE.CircleGeometry(CFG.FIELD*4,48),
      new THREE.MeshStandardMaterial({color:0x2a4a1e, roughness:0.95}));
    ground.rotation.x=-Math.PI/2; ground.receiveShadow=true; scene.add(ground);
  } else {
    const sg=new THREE.Mesh(new THREE.PlaneGeometry(200,200), new THREE.ShadowMaterial({opacity:0.26}));
    sg.rotation.x=-Math.PI/2; sg.receiveShadow=true; scene.add(sg);
  }
  const bladeGeo=new THREE.ConeGeometry(0.05,0.5,4);
  const bladeMat=new THREE.MeshStandardMaterial({color:0x3a5a24, roughness:1});
  const grass=new THREE.InstancedMesh(bladeGeo,bladeMat,400);
  const m=new THREE.Object3D();
  for(let i=0;i<400;i++){
    const a=Math.random()*6.283, r=1+Math.random()*CFG.FIELD;
    m.position.set(Math.cos(a)*r,0.25,Math.sin(a)*r);
    m.rotation.set(0,Math.random()*6.283,(Math.random()-.5)*0.3);
    const s=0.6+Math.random()*1.1; m.scale.set(s,s,s); m.updateMatrix(); grass.setMatrixAt(i,m.matrix);
  }
  scene.add(grass);
  for(let i=0;i<CFG.TREE_COUNT;i++){
    const a=Math.random()*6.283, r=2.5+Math.random()*CFG.FIELD;
    scene.add(makeTree(Math.cos(a)*r, Math.sin(a)*r));
  }
}
function makeTree(x,z){
  const t=new THREE.Group();
  const h=3.2+Math.random()*1.8;
  const trunk=new THREE.Mesh(new THREE.CylinderGeometry(0.22,0.38,h,8),
    new THREE.MeshStandardMaterial({color:0x5a3a1a, roughness:0.9}));
  trunk.position.y=h/2; trunk.castShadow=trunk.receiveShadow=true; t.add(trunk);
  const leafMat=new THREE.MeshStandardMaterial({color:0x2f6d2a, roughness:0.85});
  for(let i=0;i<3;i++){
    const cone=new THREE.Mesh(new THREE.ConeGeometry(1.9-i*0.35,2.3,8), leafMat);
    cone.position.y=h*0.8+i*1.2; cone.castShadow=true; t.add(cone);
  }
  t.position.set(x,0,z); t.rotation.y=Math.random()*6.283; return t;
}

/* ══════════════════════════════════════════════════════════════
   チャッピーロボ 3Dモデル
   ══════════════════════════════════════════════════════════════ */
let FACE_TEX=null;
function makeFaceTexture(){
  const W=512,H=384, c=document.createElement('canvas'); c.width=W; c.height=H;
  const g=c.getContext('2d');
  g.clearRect(0,0,W,H);                                    // 周囲は透明
  // 角丸の黒い画面
  const x=32,y=44,w=W-64,h=H-88,r=58;
  g.beginPath();
  g.moveTo(x+r,y); g.arcTo(x+w,y,x+w,y+h,r); g.arcTo(x+w,y+h,x,y+h,r);
  g.arcTo(x,y+h,x,y,r); g.arcTo(x,y,x+w,y,r); g.closePath();
  g.fillStyle='#0a0d0f'; g.fill();
  // 水色の発光
  g.fillStyle='#5fe0ff'; g.strokeStyle='#5fe0ff';
  g.shadowColor='#5fe0ff'; g.shadowBlur=22;
  // 目（縦長のまるい目・左右に広く）
  g.beginPath(); g.ellipse(W*0.34,H*0.43,26,40,0,0,6.283); g.fill();
  g.beginPath(); g.ellipse(W*0.66,H*0.43,26,40,0,0,6.283); g.fill();
  // ω の口
  g.lineWidth=13; g.lineJoin='round'; g.lineCap='round';
  const my=H*0.62, mw=58;
  g.beginPath();
  g.moveTo(W/2-mw, my);
  g.quadraticCurveTo(W/2-mw*0.5, my+26, W/2, my+2);
  g.quadraticCurveTo(W/2+mw*0.5, my+26, W/2+mw, my);
  g.stroke();
  const tex=new THREE.CanvasTexture(c);
  tex.anisotropy=4;
  tex.flipY=true;       // ドームのUV(上がv=1)に合わせ、画像の上＝顔の上に
  return tex;
}
/* 頂点を角丸キューブへ寄せる変形（t=0で球、t=1で立方体寄り） */
function applyRoundedCube(geo, t){
  const p=geo.attributes.position, n=new THREE.Vector3(), cube=new THREE.Vector3(), v=new THREE.Vector3();
  for(let i=0;i<p.count;i++){
    v.set(p.getX(i),p.getY(i),p.getZ(i)); const r=v.length()||1; n.copy(v).divideScalar(r);
    const m=Math.max(Math.abs(n.x),Math.abs(n.y),Math.abs(n.z))||1;
    cube.copy(n).multiplyScalar(1/m);
    n.lerp(cube,t).multiplyScalar(r);
    p.setXYZ(i, n.x, n.y, n.z);
  }
  p.needsUpdate=true; geo.computeVertexNormals(); return geo;
}
function roundedCubeGeo(radius, seg, t){
  return applyRoundedCube(new THREE.SphereGeometry(radius, seg, seg), t);
}
function buildCat(){
  const g=new THREE.Group();
  const white=new THREE.MeshStandardMaterial({color:0xffffff, roughness:0.35, metalness:0.05});
  const cyan =new THREE.MeshStandardMaterial({color:0x7fd8ef, roughness:0.5});
  const black=new THREE.MeshStandardMaterial({color:0x0a0d0f, roughness:0.28, metalness:0.15});
  const glow =new THREE.MeshStandardMaterial({color:0x4fd6ff, emissive:0x4fd6ff, emissiveIntensity:1.35, roughness:0.3});

  // 体（まるい胴）
  const body=new THREE.Mesh(new THREE.SphereGeometry(0.34,20,18), white);
  body.geometry.scale(1,1.15,0.95); body.position.y=0.42; body.castShadow=true; g.add(body);

  // 頭（角丸キューブのヘルメット＝四角ばった輪郭）
  const HEAD_T=0.34, HEAD_S=[1.06,1.05,0.86];   // 角丸の強さ / 縦横奥行の比（薄め・やわらかめ）
  const head=new THREE.Group(); head.position.y=0.92; g.add(head);
  const helm=new THREE.Mesh(roundedCubeGeo(0.40, 44, HEAD_T), white);
  helm.geometry.scale(HEAD_S[0],HEAD_S[1],HEAD_S[2]); helm.castShadow=true; head.add(helm);
  // 顔（頭とまったく同じ角丸キューブ形の前面を切り出し、わずかに前へ浮かせて貼る）
  const faceMat=new THREE.MeshBasicMaterial({map:FACE_TEX, transparent:true, depthWrite:false});
  const faceGeo=new THREE.SphereGeometry(0.40, 44, 36,
    Math.PI*0.5 - 0.62, 1.24,      // 経度：正面まわり±（横幅）
    Math.PI*0.5 - 0.44, 0.88);     // 緯度：正面まわり±（縦幅）
  applyRoundedCube(faceGeo, HEAD_T);                       // 頭と同じ角丸形に
  faceGeo.scale(HEAD_S[0],HEAD_S[1],HEAD_S[2]);           // 頭と同じ比率に
  faceGeo.scale(1.035,1.035,1.035);                        // ごくわずかに前へ浮かせる（突き抜け防止）
  // このキャップのUVを 0..1 に貼り直す（テクスチャ全体が顔に乗るように）
  const uv=faceGeo.attributes.uv, pos=faceGeo.attributes.position;
  let uMin=1,uMax=0,vMin=1,vMax=0;
  for(let i=0;i<uv.count;i++){ const u=uv.getX(i),v=uv.getY(i);
    if(u<uMin)uMin=u; if(u>uMax)uMax=u; if(v<vMin)vMin=v; if(v>vMax)vMax=v; }
  for(let i=0;i<uv.count;i++){
    uv.setXY(i, (uv.getX(i)-uMin)/(uMax-uMin), (uv.getY(i)-vMin)/(vMax-vMin));
  }
  uv.needsUpdate=true;
  const face=new THREE.Mesh(faceGeo, faceMat);
  face.position.set(0,0.02,0);
  face.renderOrder=2;
  head.add(face);

  // 耳（外白・内水色）── 大きめ・上寄り
  [-1,1].forEach(s=>{
    const ear=new THREE.Mesh(new THREE.ConeGeometry(0.20,0.40,4), white);
    ear.position.set(s*0.27,0.44,0); ear.rotation.set(0.12,Math.PI/4,s*0.18); ear.castShadow=true; head.add(ear);
    const inner=new THREE.Mesh(new THREE.ConeGeometry(0.12,0.28,4), cyan);
    inner.position.set(s*0.27,0.44,0.04); inner.rotation.set(0.12,Math.PI/4,s*0.18); head.add(inner);
  });

  // 手（小さな白いこぶ）
  [-1,1].forEach(s=>{
    const arm=new THREE.Mesh(new THREE.SphereGeometry(0.11,12,12), white);
    arm.position.set(s*0.34,0.42,0.06); arm.castShadow=true; g.add(arm);
  });
  // 足
  const feet=[];
  [-1,1].forEach(s=>{
    const leg=new THREE.Mesh(new THREE.SphereGeometry(0.13,12,12), white);
    leg.geometry.scale(1,0.8,1.2); leg.position.set(s*0.16,0.12,0.02); leg.castShadow=true;
    g.add(leg); feet.push(leg);
  });

  // しっぽ（カーブ）＋リンゴ
  const curve=new THREE.CatmullRomCurve3([
    new THREE.Vector3(0,0.35,-0.28),
    new THREE.Vector3(-0.15,0.30,-0.55),
    new THREE.Vector3(-0.30,0.55,-0.62),
    new THREE.Vector3(-0.28,0.95,-0.50),
    new THREE.Vector3(-0.12,1.15,-0.36),
  ]);
  const tail=new THREE.Mesh(new THREE.TubeGeometry(curve,24,0.045,8,false), white);
  tail.castShadow=true; g.add(tail);
  // リンゴ
  const apple=new THREE.Group(); apple.position.set(-0.12,1.28,-0.34); g.add(apple);
  const ap=new THREE.Mesh(new THREE.SphereGeometry(0.14,16,16),
    new THREE.MeshStandardMaterial({color:0xe23b2e, roughness:0.3, metalness:0.1}));
  ap.geometry.scale(1,0.92,1); ap.castShadow=true; apple.add(ap);
  const stem=new THREE.Mesh(new THREE.CylinderGeometry(0.012,0.012,0.09,5),
    new THREE.MeshStandardMaterial({color:0x5a3a1a}));
  stem.position.y=0.15; stem.rotation.z=0.2; apple.add(stem);
  const leaf=new THREE.Mesh(new THREE.SphereGeometry(0.05,8,8),
    new THREE.MeshStandardMaterial({color:0x4a9d3a}));
  leaf.geometry.scale(1.6,0.3,0.9); leaf.position.set(0.06,0.17,0); leaf.rotation.z=-0.5; apple.add(leaf);

  g.userData.feet=feet;
  g.scale.setScalar(CFG.CAT_SCALE*0.62);   // 実寸およそ0.55m
  return g;
}

/* ══════════════════════════════════════════════════════════════
   チャッピーを配置・歩き回らせる
   ══════════════════════════════════════════════════════════════ */
const cats=[];
function placeCats(){
  const R = MODE==='xr' ? 5.5 : CFG.FIELD*0.7;
  const base=CFG.CAT_SCALE*0.62;
  for(let i=0;i<CFG.TOTAL;i++){
    const c=buildCat();
    // 大きさをばらけさせる：半分はそのまま、半分は小さめ（見つけにくい）
    const sizeMul = Math.random()<0.5 ? 1.0 : (0.5 + Math.random()*0.2);
    const sc = base*sizeMul;
    c.scale.setScalar(sc);
    c.userData.baseScale=sc;
    const a=Math.random()*6.283, r=1.2+Math.random()*R;
    const x=Math.cos(a)*r, z=Math.sin(a)*r;
    c.position.set(x,0,z);
    c.rotation.y=Math.random()*6.283;
    c.userData.caught=false;
    c.userData.phase=Math.random()*6.283;
    c.userData.speed=0.25+Math.random()*0.35;     // m/s
    pickTarget(c, R);
    scene.add(c); cats.push(c);
  }
}
function pickTarget(c, R){
  const a=Math.random()*6.283, r=1+Math.random()*(R||6);
  c.userData.tx=Math.cos(a)*r; c.userData.tz=Math.sin(a)*r;
  c.userData.wait=0.4+Math.random()*1.6;          // 到着後の休憩
}
const _dir=new THREE.Vector3();
function wander(c, dt){
  const u=c.userData;
  if(u.wait>0){ u.wait-=dt; return; }
  const dx=u.tx-c.position.x, dz=u.tz-c.position.z;
  const d=Math.hypot(dx,dz);
  if(d<0.15){ pickTarget(c, MODE==='xr'?5.5:CFG.FIELD*0.7); return; }
  const step=Math.min(u.speed*dt, d);
  c.position.x+=dx/d*step; c.position.z+=dz/d*step;
  // 進む向きへゆっくり回頭
  const want=Math.atan2(dx,dz);
  let diff=want-c.rotation.y; while(diff>Math.PI)diff-=6.283; while(diff<-Math.PI)diff+=6.283;
  c.rotation.y+=diff*Math.min(1,dt*6);
}

/* ══════════════════════════════════════════════════════════════
   向き（非XR）
   ══════════════════════════════════════════════════════════════ */
const deg=Math.PI/180;
let orient=null, yaw=0, pit=0;
function onOrient(e){
  if(e.alpha===null&&e.beta===null&&e.gamma===null) return;
  orient={alpha:(e.alpha||0)*deg, beta:(e.beta||0)*deg, gamma:(e.gamma||0)*deg};
}
const _zee=new THREE.Vector3(0,0,1), _euler=new THREE.Euler();
const _q0=new THREE.Quaternion(), _q1=new THREE.Quaternion(-Math.SQRT1_2,0,0,Math.SQRT1_2);
function applyOrientation(){
  if(!orient){ camera.rotation.set(pit,yaw,0,'YXZ'); return; }
  const scr=((screen.orientation&&screen.orientation.angle)||window.orientation||0)*deg;
  _euler.set(orient.beta, orient.alpha, -orient.gamma, 'YXZ');
  camera.quaternion.setFromEuler(_euler);
  camera.quaternion.multiply(_q1);
  camera.quaternion.multiply(_q0.setFromAxisAngle(_zee,-scr));
}

/* ══════════════════════════════════════════════════════════════
   照準判定
   ══════════════════════════════════════════════════════════════ */
const _v=new THREE.Vector3(), fwd=new THREE.Vector3(), camPos=new THREE.Vector3();
let hover=null;
function updateHover(){
  if(MODE==='xr' && renderer.xr.isPresenting){
    try{ renderer.xr.getCamera(camera); }catch(e){}
  }
  camera.getWorldPosition(camPos);
  camera.getWorldDirection(fwd);
  let best=Math.cos(CFG.CATCH_ANGLE*deg), pick=null;
  for(const c of cats){
    if(c.userData.caught) continue;
    _v.copy(c.position).setY(camPos.y).sub(camPos);   // 高さは無視して水平で判定
    const dist=_v.length();
    if(dist>CFG.CATCH_DIST) continue;
    _v.normalize();
    const flat=fwd.clone().setY(0).normalize();
    const dot=_v.dot(flat);
    if(dot>best){ best=dot; pick=c; }
  }
  hover=pick;
  netEl.classList.toggle('on', !!hover && gameActive);
  if(hover && gameActive){ targetEl.textContent='チャッピー'; targetEl.classList.add('on'); }
  else targetEl.classList.remove('on');
}

/* ══════════════════════════════════════════════════════════════
   ループ
   ══════════════════════════════════════════════════════════════ */
function tick(){
  const dt=Math.min(clock.getDelta(),0.05);
  const t=clock.elapsedTime;
  for(const c of cats){
    if(c.userData.caught) continue;
    if(CFG.WANDER && gameActive) wander(c,dt);
    // てくてく：体の上下＋足
    const moving=c.userData.wait<=0 && gameActive;
    const bob=moving?Math.abs(Math.sin(t*6+c.userData.phase))*0.03:0;
    c.position.y=bob;
    if(c.userData.feet){
      c.userData.feet[0].position.y=0.12+(moving?Math.max(0,Math.sin(t*6+c.userData.phase))*0.05:0);
      c.userData.feet[1].position.y=0.12+(moving?Math.max(0,Math.sin(t*6+c.userData.phase+Math.PI))*0.05:0);
    }
  }
  if(MODE==='xr' && renderer.xr.isPresenting){}
  else if(MODE==='ios') applyOrientation();
  else if(controls) controls.update();
  updateHover();
  renderer.render(scene,camera);
}

/* ══════════════════════════════════════════════════════════════
   ゲーム進行
   ══════════════════════════════════════════════════════════════ */
let gameActive=false, timeLeft=CFG.TIME_SEC, found=0, timerId=null;
const netEl=document.getElementById('net'), targetEl=document.getElementById('target');
const popEl=document.getElementById('pop'), foundEl=document.getElementById('found');
const timeEl=document.getElementById('time'), timerPanel=document.getElementById('timerPanel');
const catchBtn=document.getElementById('catch');

function fmt(s){ const m=(s/60|0), ss=s%60; return m+':'+String(ss).padStart(2,'0'); }
function startGame(){
  gameActive=true; timeLeft=CFG.TIME_SEC; found=0;
  foundEl.textContent='0'; timeEl.textContent=fmt(timeLeft);
  timerPanel.classList.remove('warn','danger');
  catchBtn.disabled=false;
  timerId=setInterval(()=>{
    timeLeft--; timeEl.textContent=fmt(Math.max(0,timeLeft));
    if(timeLeft<=30) timerPanel.classList.add('warn');
    if(timeLeft<=10) timerPanel.classList.add('danger');
    if(timeLeft<=0) endGame();
  },1000);
}
function endGame(){
  gameActive=false; clearInterval(timerId);
  catchBtn.disabled=true;
  netEl.classList.remove('on'); targetEl.classList.remove('on');
  document.getElementById('score').textContent=found;
  const rank = found>=20?'★★★ かんぺき！' : found>=15?'★★★ すごい！' :
               found>=10?'★★☆ いいね！' : found>=5?'★☆☆ その調子！' : '☆☆☆ もういちど！';
  document.getElementById('rank').textContent=rank;
  document.getElementById('rmsg').textContent =
    found>=CFG.TOTAL ? '20匹ぜんぶ見つけました！' : (CFG.TOTAL-found)+'匹 のこっていました';
  document.getElementById('result').style.display='flex';
}
function doCatch(){
  netEl.classList.remove('swing'); void netEl.offsetWidth; netEl.classList.add('swing');
  setTimeout(()=>netEl.classList.remove('swing'),130);
  if(!hover || !gameActive) return;
  const c=hover; c.userData.caught=true;
  let k=0;(function suck(){ k+=0.09; c.scale.multiplyScalar(0.84);
    c.position.lerp(camPos,0.16); if(k<1) requestAnimationFrame(suck); else c.visible=false; })();
  found++; foundEl.textContent=found;
  popEl.textContent = found>=CFG.TOTAL ? 'コンプリート！' : 'みつけた！ '+found;
  popEl.classList.remove('hit'); void popEl.offsetWidth; popEl.classList.add('hit');
  hover=null;
  if(found>=CFG.TOTAL) setTimeout(endGame,700);
}
catchBtn.onclick=doCatch;

/* ══════════════════════════════════════════════════════════════
   起動
   ══════════════════════════════════════════════════════════════ */
async function enableSensor(){
  const D=window.DeviceOrientationEvent; if(!D) return false;
  if(typeof D.requestPermission==='function'){
    try{ if(await D.requestPermission()!=='granted') return false; }catch(_){ return false; }
  }
  addEventListener('deviceorientation', onOrient); return true;
}
async function startCameraBG(){
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia) return false;
  try{
    const st=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'}},audio:false});
    vid.srcObject=st; await vid.play(); vid.style.display='block'; scene.background=null; return true;
  }catch(e){ fail('カメラERR '+(e.name||e)); return false; }
}
async function startXR(){
  const session=await navigator.xr.requestSession('immersive-ar',{
    requiredFeatures:['local-floor'], optionalFeatures:['dom-overlay'],
    domOverlay:{root:document.body}
  });
  renderer.xr.setReferenceSpaceType('local-floor');
  await renderer.xr.setSession(session);
  session.addEventListener('end',()=>{ gameActive=false; });
  scene.background=null; scene.fog=null;
  hideStart();
  renderer.setAnimationLoop(()=>{ tick(); });
}
function fallbackDesktop(){
  scene.background=new THREE.Color(0x9fd2ec);
  scene.fog=new THREE.FogExp2(0xbfe0f0,0.018);
  controls=new THREE.OrbitControls(camera, renderer.domElement);
  controls.enableDamping=true; controls.enablePan=false;
  controls.target.set(0,CFG.EYE_HEIGHT,-0.01);
  controls.minDistance=controls.maxDistance=0.001;
}
function hideStart(){ const s=document.getElementById('start'); if(s) s.style.display='none'; }
function loopRAF(){ hideStart(); (function raf(){ if(MODE==='xr'&&renderer.xr.isPresenting)return;
  requestAnimationFrame(raf); tick(); })(); }

/* iOSでセンサー拒否時の簡易ドラッグ */
function setupDrag(){
  let d=null; const el=renderer.domElement;
  el.addEventListener('pointerdown',e=>d={x:e.clientX,y:e.clientY,yaw,pit});
  el.addEventListener('pointermove',e=>{ if(!d)return;
    yaw=d.yaw-(e.clientX-d.x)*0.005; pit=Math.max(-1.4,Math.min(1.4,d.pit-(e.clientY-d.y)*0.005)); });
  el.addEventListener('pointerup',()=>d=null);
}

async function begin(){
  goBtn.outerHTML='<div id="load">森とチャッピーを よういしています…</div>';
  FACE_TEX=makeFaceTexture();
  initThree(); buildForest(); placeCats();

  if(MODE==='xr'){
    try{ await startXR(); }
    catch(e){ fail('XR起動失敗:'+(e.name||e)); MODE='desktop'; fallbackDesktop(); loopRAF(); }
  } else if(MODE==='ios'){
    const sOK=await enableSensor();
    const cOK=await startCameraBG();
    if(!cOK){ fallbackDesktop(); }
    else if(!sOK){ setupDrag(); }
    loopRAF();
  } else {
    fallbackDesktop(); loopRAF();
  }
  startGame();
}
goBtn.onclick=begin;

document.getElementById('again').onclick=()=>{
  // 全ねこを復活
  for(const c of cats){
    c.userData.caught=false; c.visible=true;
    c.scale.setScalar(c.userData.baseScale);
    const R=MODE==='xr'?5.5:CFG.FIELD*0.7;
    const a=Math.random()*6.283, r=1.2+Math.random()*R;
    c.position.set(Math.cos(a)*r,0,Math.sin(a)*r);
    pickTarget(c,R);
  }
  document.getElementById('result').style.display='none';
  startGame();
};

/* 初期化 */
(async function boot(){
  await detectMode();
  if(MODE==='xr'){
    leadEl.textContent='まわりが森になり、チャッピーがかくれています。歩いてさがし、近づいて「つかまえる」。3分で20匹めざそう！';
    noteEl.textContent='平らな床を映してからはじめてください。歩けるスペースでどうぞ。';
    modeEl.textContent='AR（歩行）モード';
  } else if(MODE==='ios'){
    leadEl.textContent='カメラをとおすと森になり、チャッピーがかくれています。かざして見まわし、近づいて「つかまえる」。3分で20匹！';
    noteEl.innerHTML='iPhoneは歩行追跡に非対応のため、その場で見まわすARです<br>設定→Safari→「モーションと画面の向きのアクセス」をオンに';
    modeEl.textContent='AR（見まわし）モード';
  } else {
    leadEl.textContent='森にチャッピーがかくれています。ドラッグで見まわし、照準に入れて「つかまえる」。3分で20匹めざそう！';
    noteEl.textContent='スマホの実機（https://）で開くとARになります';
    modeEl.textContent='プレビュー（森）モード';
  }
  goBtn.style.display='';
})();
</script>
